<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoir Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="brand/memoir-rhino-ui.png" alt="Memoir" class="brand-logo-img">
        <div>
          <h1>Memoir</h1>
          <span class="version">Autofill & Vault</span>
        </div>
      </div>
      <div class="header-status">
        <span class="status-dot" id="status-dot"></span>
      </div>
    </header>

    <!-- Logged Out View -->
    <div id="view-login" class="view">
      <div class="login-box">
        <p class="login-desc">Connect to your private encrypted vault to enable 1-tap autofill and smart capture.</p>
        <div class="form-group">
          <label for="vault-code">4-Digit Account Code</label>
          <input type="password" id="vault-code" maxlength="4" placeholder="••••" inputmode="numeric" autofocus>
        </div>
        <div class="form-group advanced-opt">
          <label for="server-url">Vault Server URL</label>
          <input type="text" id="server-url" value="https://memoir-vert.vercel.app" placeholder="https://...">
        </div>
        <button type="button" id="btn-login" class="btn primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
          <span>Connect Vault</span>
        </button>
        <p id="login-error" class="error-text" style="display:none;"></p>
      </div>
    </div>

    <!-- Logged In View -->
    <div id="view-active" class="view" style="display:none;">
      <!-- Profile Banner -->
      <div class="profile-card">
        <div class="avatar" id="user-avatar">M</div>
        <div class="profile-info">
          <strong id="user-name">Maaz</strong>
          <small id="user-email">maaz@memo.com</small>
        </div>
        <span class="badge active">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          Active
        </span>
      </div>

      <!-- Quick Action Tools Grid -->
      <div class="quick-tools-grid">
        <button type="button" id="btn-open-manual-save" class="tool-pill-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          <span>Quick Save</span>
        </button>
        <button type="button" id="btn-gen-pwd-popup" class="tool-pill-btn accent">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          <span>Password Gen</span>
        </button>
      </div>

      <!-- Password Generator Result Box -->
      <div id="gen-pwd-box" class="gen-box" style="display:none;">
        <div class="gen-box-head">
          <span>Cryptographic Password</span>
          <button type="button" id="btn-copy-gen-pwd" class="btn-mini">Copy</button>
        </div>
        <input type="text" id="gen-pwd-output" class="gen-output" readonly>
      </div>

      <!-- Main Navigation Tabs: Active Site vs All Saved -->
      <div class="popup-tabs">
        <button type="button" class="tab-btn active" id="tab-site">
          <span>Active Site</span>
        </button>
        <button type="button" class="tab-btn" id="tab-all">
          <span>All Saved (<span id="all-count">0</span>)</span>
        </button>
      </div>

      <!-- Search Bar (Visible in All Saved tab or general) -->
      <div class="search-box" id="popup-search-box" style="display:none;">
        <input type="text" id="popup-search-input" placeholder="Search usernames, passwords, portals…">
      </div>

      <!-- Duplicate Alert Banner -->
      <div id="duplicate-cleaner-banner" class="duplicate-banner" style="display:none;">
        <div class="dup-text">
          <span>⚠️ Duplicate records found.</span>
        </div>
        <button type="button" id="btn-clean-duplicates" class="btn-clean-dup">Clean Duplicates</button>
      </div>

      <!-- Credentials List Section -->
      <div class="section-box">
        <div class="section-title">
          <span id="section-title-label">Active Site</span>
          <strong id="active-domain">current-site.com</strong>
        </div>
        <div id="credentials-list" class="credentials-list">
          <p class="empty-text">Loading credentials…</p>
        </div>
      </div>

      <!-- Toggles Box -->
      <div class="toggles-box">
        <label class="toggle-row">
          <span>Smart In-Field Autofill</span>
          <input type="checkbox" id="toggle-autofill" checked>
        </label>
        <label class="toggle-row">
          <span>Form Auto-Capture</span>
          <input type="checkbox" id="toggle-capture" checked>
        </label>
      </div>

      <!-- Footer Actions -->
      <div class="footer-actions">
        <button type="button" id="btn-open-app" class="btn secondary">
          <span>Open Memoir App</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
        </button>
        <button type="button" id="btn-logout" class="btn text">Sign Out</button>
      </div>
    </div>

    <!-- FULL OVERLAY PANEL: Edit Record -->
    <div id="edit-overlay-panel" class="overlay-panel" style="display:none;">
      <div class="panel-header">
        <button type="button" id="btn-close-edit-panel" class="panel-back-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
          <span>Back to Vault</span>
        </button>
        <strong>Edit Record</strong>
      </div>
      <div class="panel-body">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="edit-title" placeholder="Record title">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="edit-type" class="select-input">
            <option value="Login">Login Account</option>
            <option value="Government Document">Government Document</option>
            <option value="Identity">Identity Document</option>
            <option value="Finance">Bank / Card</option>
            <option value="Personal">Personal Record</option>
          </select>
        </div>
        <div class="form-group">
          <label>Username / Document / ID</label>
          <input type="text" id="edit-user" placeholder="Username, email, or ACK number">
        </div>
        <div class="form-group">
          <label>Password / Secret</label>
          <div class="input-with-eye">
            <input type="password" id="edit-pwd" placeholder="••••••••">
            <button type="button" id="btn-toggle-edit-pwd" class="eye-btn" title="Toggle password">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Note / Context</label>
          <textarea id="edit-note" rows="2" class="textarea-input" placeholder="Context or reminders…"></textarea>
        </div>
      </div>
      <div class="panel-footer">
        <button type="button" id="btn-cancel-edit" class="btn secondary">Cancel</button>
        <button type="button" id="btn-save-edit" class="btn primary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Save Changes</span>
        </button>
      </div>
    </div>

    <!-- FULL OVERLAY PANEL: Quick Save Record -->
    <div id="save-overlay-panel" class="overlay-panel" style="display:none;">
      <div class="panel-header">
        <button type="button" id="btn-close-save-panel" class="panel-back-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
          <span>Back</span>
        </button>
        <strong>Quick Save to Vault</strong>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="manual-title" placeholder="e.g. UUCMS Account">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="manual-type" class="select-input">
            <option value="Login">Login Account</option>
            <option value="Government Document">Government Document</option>
            <option value="Identity">Identity Document</option>
            <option value="Finance">Bank / Card</option>
            <option value="Personal">Personal Record</option>
          </select>
        </div>
        <div class="form-group">
          <label>Username / ID / ACK</label>
          <input type="text" id="manual-user" placeholder="e.g. U18AJ22S0105 or RD1218185132439">
        </div>
        <div class="form-group">
          <label>Password / Secret (Optional)</label>
          <input type="password" id="manual-pwd" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Note / Context</label>
          <textarea id="manual-note" rows="2" class="textarea-input" placeholder="Purpose or context…"></textarea>
        </div>
      </div>
      <div class="panel-footer">
        <button type="button" id="btn-cancel-manual" class="btn secondary">Cancel</button>
        <button type="button" id="btn-save-manual" class="btn primary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Save to Memoir</span>
        </button>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
