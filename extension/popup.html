<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoir Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="rhino-icon">🦏</span>
        <div>
          <h1>Memoir</h1>
          <span class="version">Autofill & Capture</span>
        </div>
      </div>
      <span class="status-dot" id="status-dot"></span>
    </header>

    <!-- Logged Out View -->
    <div id="view-login" class="view">
      <div class="login-box">
        <p class="login-desc">Connect to your private vault to enable 1-tap autofill and smart capture.</p>
        <div class="form-group">
          <label for="vault-code">Enter 4-Digit Account Code</label>
          <input type="password" id="vault-code" maxlength="4" placeholder="••••" inputmode="numeric" autofocus>
        </div>
        <div class="form-group advanced-opt">
          <label for="server-url">Vault Server URL</label>
          <input type="text" id="server-url" value="https://memoir-vert.vercel.app" placeholder="https://...">
        </div>
        <button type="button" id="btn-login" class="btn primary">Connect Vault</button>
        <p id="login-error" class="error-text" style="display:none;"></p>
      </div>
    </div>

    <!-- Logged In View -->
    <div id="view-active" class="view" style="display:none;">
      <div class="profile-card">
        <div class="avatar" id="user-avatar">M</div>
        <div class="profile-info">
          <strong id="user-name">Maaz</strong>
          <small id="user-email">maaz@memo.com</small>
        </div>
        <span class="badge active">Active</span>
      </div>

      <!-- Active Site & Matches -->
      <div class="section-box">
        <div class="section-title">
          <span>Active Site</span>
          <strong id="active-domain">current-site.com</strong>
        </div>
        <div id="site-credentials-list" class="credentials-list">
          <p class="empty-text">No matching logins for this tab</p>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="quick-tools-grid">
        <button type="button" id="btn-open-manual-save" class="tool-pill-btn">
          <span>📝</span> Manual Save
        </button>
        <button type="button" id="btn-gen-pwd-popup" class="tool-pill-btn">
          <span>✨</span> Generate Password
        </button>
      </div>

      <!-- Password Generator Result Box (Hidden by default) -->
      <div id="gen-pwd-box" class="gen-box" style="display:none;">
        <div class="gen-box-head">
          <span>Strong Password</span>
          <button type="button" id="btn-copy-gen-pwd" class="btn-mini">Copy</button>
        </div>
        <input type="text" id="gen-pwd-output" class="gen-output" readonly>
      </div>

      <!-- Manual Save Form Box (Hidden by default) -->
      <div id="manual-save-box" class="manual-box" style="display:none;">
        <div class="manual-box-head">
          <strong>Save Tab Details to Vault</strong>
          <button type="button" id="btn-close-manual" class="close-btn">&times;</button>
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="manual-title" placeholder="e.g. Karnataka ACK Number">
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="manual-type" class="select-input">
            <option value="Government Document">Government Document</option>
            <option value="Login">Login Account</option>
            <option value="Identity">Identity Document</option>
            <option value="Finance">Bank / Card</option>
            <option value="Personal">Personal Record</option>
          </select>
        </div>
        <div class="form-group">
          <label>Value / Number / ID</label>
          <input type="text" id="manual-val" placeholder="e.g. RD1218185132439 or Username">
        </div>
        <div class="form-group">
          <label>Note / Memo</label>
          <input type="text" id="manual-note" placeholder="Context or purpose…">
        </div>
        <button type="button" id="btn-save-manual" class="btn primary" style="margin-top:4px;">Save to Memoir</button>
      </div>

      <!-- Toggles -->
      <div class="toggles-box">
        <label class="toggle-row">
          <span>Smart Autofill</span>
          <input type="checkbox" id="toggle-autofill" checked>
        </label>
        <label class="toggle-row">
          <span>Form Auto-Capture</span>
          <input type="checkbox" id="toggle-capture" checked>
        </label>
      </div>

      <div class="footer-actions">
        <button type="button" id="btn-open-app" class="btn secondary">Open Memoir App ↗</button>
        <button type="button" id="btn-logout" class="btn text">Sign Out</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
