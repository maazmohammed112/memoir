<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kredoNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00e5a3" />
      <stop offset="100%" stop-color="#00ffa3" />
    </linearGradient>
    <linearGradient id="kredoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Badge -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#kredoDark)" stroke="url(#kredoNeon)" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Glowing K Monogram -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <path d="M28 24 L40 24 L40 76 L28 76 Z" fill="url(#kredoNeon)"/>
    <!-- Diagonal Upper Arm -->
    <path d="M42 46 L62 24 L76 24 L52 50 Z" fill="url(#kredoNeon)"/>
    <!-- Diagonal Lower Arm with Chip Chamfer -->
    <path d="M50 48 L76 76 L62 76 L39 52 Z" fill="url(#kredoNeon)"/>
    <!-- Chip Bevel Accent Lines -->
    <path d="M35 34 L35 66" stroke="#090b10" stroke-width="2" stroke-linecap="round"/>
    <path d="M48 34 L62 48" stroke="#090b10" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
